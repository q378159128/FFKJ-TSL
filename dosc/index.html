<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0"> -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="//cdn.bootcdn.net/ajax/libs/docsify/4.13.1/themes/vue.min.css" />
  <link rel="stylesheet" href="./lib/mermaid.min.css">


</head>

<body>
  <div id="app">加载中</div>
  <script>

    // var num = 0;
    // mermaid.initialize({ startOnLoad: true });

    window.$docsify = {
      name: '非凡科技',
      homepage: 'README.md',


      // loadNavbar: true, //关闭版本切换
      // mergeNavbar: true,
      // subMaxLevel: 3,
      // sidebarDisplayLevel: 1, // set sidebar display level

      // relativePath: true,
      // formatUpdated: '{YYYY}/{MM}/{DD}',


      // Sidebar Configuration
      auto2top: true, //点击自动跳转到页面最上面
      topMargin: 20, // 点击跳转时的顶部偏移量


      loadSidebar: true, // 加载侧边栏
      // sidebarDisplayLevel: 1, // set sidebar display level

      maxLevel: 0,
      // Set subMaxLevel to 0 to remove automatic display of page table of contents (TOC) in Sidebar
      subMaxLevel: 3, //目录展开级别

      disqus: 'shortname',
      // 搜索插件配置
      search: {
        placeholder: {
          '/': '全局搜索...'
        },
        noData: '找不到结果！',
        depth: 2
      },

      // 自定义插件 mermaid
      plugins: [
        function (hook, vm) {
          hook.ready(function () {
            mermaid.initialize({ startOnLoad: false });
          });
          hook.doneEach(function () {
            mermaid.init(undefined, '.mermaid');
          });
        }
      ],
      markdown: {
        renderer: {
          code: function (code, lang) {
            var html = '';
            if (code.match(/^sequenceDiagram/) || code.match(/^graph/) || code.match(/^gantt/)) {
              html = '<div class="mermaid">' + code + '</div>';
            }
            var hl = Prism.highlight(code, Prism.languages[lang] || Prism.languages.markup);
            return html + '<pre v-pre data-lang="' + lang + '"><code class="lang-' + lang + '">' + hl + '</code></pre>';
          }
        }
      }

    }
  </script>
  <script src="//cdn.bootcdn.net/ajax/libs/docsify/4.13.1/docsify.min.js"></script>
  <!-- 全局搜索插件 -->
  <script src="./lib/search.min.js"></script>
  <!-- 代码复制插件 -->
  <script src="./lib/docsify-copy-code.js"></script>
  <!-- mermaid插件支持 -->
  <script src="./lib/mermaid.min.js"></script>
</body>

</html>
